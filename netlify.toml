# Netlify Configuration for Gallbladder Cancer Detection WebApp

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Keep this aligned with the backend that exposes /health and /predict
  VITE_API_URL = "https://AmityCentreforAI-gbca.hf.space"

# Redirect all non-matching routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache settings for static assets
[[headers]]
  for = "/dist/**"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Cache settings for HTML (no cache)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache settings for images
[[headers]]
  for = "/public/**"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# CORS headers for API calls if needed
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
